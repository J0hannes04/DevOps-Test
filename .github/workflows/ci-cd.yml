name: Local CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted # Das sagt GitHub: Nutze den Windows-Runner!

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build & Test (Continuous Integration)
      run: mvn clean test

    - name: Docker Image bauen
      run: docker build -t devops-project/spring-app:latest .

    - name: Deployment via Docker Compose (Continuous Deployment)
      run: docker compose up --build -d
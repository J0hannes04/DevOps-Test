name: Local CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build & Test (Continuous Integration)
      run: .\mvnw.cmd clean test   # <--- Hier wurde der Wrapper für Windows eingesetzt

    - name: Docker Image bauen
      run: docker build -t devops-project/spring-app:latest .

    - name: Deployment via Docker Compose (Continuous Deployment)
      run: docker compose up --build -d